<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flushing Dashboard</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: "Segoe UI", Arial, sans-serif; color: #1f2933; background: #eef2f5; }
#app { display: flex; height: 100%; }
#mapPane { flex: 1 1 auto; position: relative; min-width: 0; background: #f7f9fb; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; display: block; }
#map.dragging { cursor: grabbing; }
#resultsPane { flex: 0 0 440px; max-width: 45%; display: flex; flex-direction: column; background: #fff; border-left: 1px solid #cbd2d9; }
#resultsPane header { padding: 12px 14px; background: #184b73; color: #fff; }
#resultsPane header h1 { margin: 0; font-size: 17px; }
#resultsPane header div { font-size: 12px; opacity: .85; margin-top: 2px; }
#results { flex: 1 1 auto; overflow-y: auto; }
.seq { border-bottom: 1px solid #d9e0e6; }
.seq-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; background: #f1f5f8; }
.seq-head:hover { background: #e6eef4; }
.seq.active .seq-head { background: #d9edf8; }
.seq-head .name { font-weight: 600; flex: 1; }
.seq-head .totals { font-size: 12px; color: #52606d; }
.seq-body { display: none; }
.seq.active .seq-body { display: block; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; padding: 5px 8px; background: #fafbfc; color: #52606d; font-weight: 600; border-bottom: 1px solid #d9e0e6; position: sticky; top: 0; }
td { padding: 6px 8px; border-bottom: 1px solid #edf0f3; vertical-align: top; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.op { cursor: pointer; }
tr.op:hover { background: #f1f7fb; }
tr.op.current { background: #fff1cf; }
tr.op.done { color: #7b8794; }
.valve-line { display: block; }
.tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 3px; margin-right: 4px; color: #fff; }
.tag.close { background: #d64545; }
.tag.open { background: #2f9e44; }
.tag.hyd { background: #0b7285; }
.muted { color: #9aa5b1; }
#controls { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(255,255,255,.96); border: 1px solid #cbd2d9; border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
#controls .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#controls button { height: 32px; min-width: 36px; border: 1px solid #a6b3c0; background: #f5f7fa; border-radius: 6px; cursor: pointer; font-size: 15px; }
#controls button:hover { background: #e4ebf1; }
#controls button.primary { background: #184b73; color: #fff; border-color: #184b73; min-width: 44px; }
#controls select, #controls label { font-size: 12.5px; }
#controls input[type=range] { flex: 1 1 160px; min-width: 120px; }
#status { font-size: 13px; font-weight: 600; margin-top: 6px; }
#status small { font-weight: 400; color: #52606d; }
#legend { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.95); border: 1px solid #cbd2d9; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
#legend div { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
#legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; }
#legend b { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid; }
#legend s { display: inline-block; width: 11px; height: 11px; border: 2px solid; text-decoration: none; }
#tip { position: absolute; pointer-events: none; background: #1f2933; color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 12px; display: none; white-space: nowrap; }
.zoom-buttons { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom-buttons button { width: 32px; height: 32px; border: 1px solid #a6b3c0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 16px; }
@media (max-width: 900px) { #app { flex-direction: column; } #resultsPane { flex: 0 0 40%; max-width: none; border-left: 0; border-top: 1px solid #cbd2d9; } }
</style>
</head>
<body>
<div id="app">
  <div id="mapPane">
    <canvas id="map"></canvas>
    <div id="legend">
      <div><i style="border-color:#c5ccd3"></i>Pipes</div>
      <div><i style="border-color:#3b82c4"></i>Previously flushed</div>
      <div><i style="border-color:#f08c00;border-top-width:5px"></i>Flushed now</div>
      <div><b style="border-color:#0b7285;background:#22b8cf"></b>Flushing hydrant</div>
      <div><b style="border-color:#3b82c4;background:#fff"></b>Flushed hydrant</div>
      <div><s style="border-color:#a61e1e;background:#e03131"></s>Closed valve</div>
      <div><s style="border-color:#2b8a3e;background:#51cf66"></s>Reopened valve</div>
      <div><s style="border-color:#868e96;background:#fff"></s>Valve operated in sequence</div>
    </div>
    <div class="zoom-buttons">
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomOut" title="Zoom out">&minus;</button>
      <button id="zoomSeq" title="Zoom to selected sequence">&#9635;</button>
      <button id="zoomAll" title="Zoom to full network">&#8962;</button>
    </div>
    <div id="controls">
      <div class="row">
        <button id="btnReset" title="Back to start">&#9198;</button>
        <button id="btnPrev" title="Previous operation">&#9664;</button>
        <button id="btnPlay" class="primary" title="Play / pause">&#9654;</button>
        <button id="btnNext" title="Next operation">&#9654;&#10073;</button>
        <input id="slider" type="range" min="0" max="0" value="0">
        <label>Speed
          <select id="speed">
            <option value="2400">0.5x</option>
            <option value="1200" selected>1x</option>
            <option value="600">2x</option>
            <option value="300">4x</option>
          </select>
        </label>
        <label><input id="chkAll" type="checkbox"> Continue through all sequences</label>
        <label><input id="chkFollow" type="checkbox" checked> Follow flushing</label>
      </div>
      <div id="status"></div>
    </div>
    <div id="tip"></div>
  </div>
  <div id="resultsPane">
    <header>
      <h1 id="title">Flushing Results</h1>
      <div id="subtitle"></div>
    </header>
    <div id="results"></div>
  </div>
</div>
<script>
const DATA = __DASHBOARD_DATA__;

(function () {
  "use strict";
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const tip = document.getElementById("tip");
  const COLORS = { pipe: "#c5ccd3", prev: "#3b82c4", cur: "#f08c00" };

  // Equirectangular projection scaled by cos(latitude) so shapes keep their proportions.
  let lonSum = 0, latSum = 0, n = 0;
  DATA.pipes.forEach(p => p.c.forEach(c => { lonSum += c[0]; latSum += c[1]; n++; }));
  const lat0 = n ? latSum / n : 0;
  const kx = Math.cos(lat0 * Math.PI / 180);
  const proj = c => [c[0] * kx, c[1]];

  const pipes = new Map();
  DATA.pipes.forEach(p => pipes.set(p.id, p.c.map(proj)));
  const hydrants = new Map(DATA.hydrants.map(h => [h.id, proj([h.x, h.y])]));
  const valves = new Map(DATA.valves.map(v => [v.id, proj([v.x, v.y])]));
  const zones = ((DATA.zones && DATA.zones.features) || []).map(f => {
    const g = f.geometry || {};
    const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
    const rings = polys.map(poly => poly.map(r => r.map(proj)));
    const label = f.properties && DATA.zones.labelField ? f.properties[DATA.zones.labelField] : null;
    return { rings, label };
  });

  function bounds(points) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    points.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
    return x0 === Infinity ? null : [x0, y0, x1, y1];
  }
  const allPoints = [];
  pipes.forEach(l => l.forEach(p => allPoints.push(p)));
  hydrants.forEach(p => allPoints.push(p));
  valves.forEach(p => allPoints.push(p));
  zones.forEach(z => z.rings.forEach(poly => poly.forEach(r => r.forEach(p => allPoints.push(p)))));
  const fullBounds = bounds(allPoints) || [0, 0, 1, 1];

  // Per-sequence data: operated features and cumulative state per step.
  const seqs = DATA.sequences.map(s => {
    const pts = [];
    const opValves = new Set(), opHyds = new Set();
    s.ops.forEach(o => {
      o.pipes.forEach(id => (pipes.get(id) || []).forEach(p => pts.push(p)));
      o.close.concat(o.open).forEach(id => { opValves.add(id); if (valves.has(id)) pts.push(valves.get(id)); });
      o.hydrants.forEach(id => { opHyds.add(id); if (hydrants.has(id)) pts.push(hydrants.get(id)); });
    });
    const tt = s.ops.reduce((a, o) => a + (o.time || 0), 0);
    const tv = s.ops.reduce((a, o) => a + (o.volume || 0), 0);
    return { s, bounds: bounds(pts), opValves, opHyds, totalTime: tt, totalVolume: tv };
  });

  let seqIdx = 0, step = 0, playing = false, timer = null;
  let view = { cx: 0, cy: 0, scale: 1 };
  let W = 0, H = 0, dpr = 1;

  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    draw();
  }
  const sx = x => (x - view.cx) * view.scale + W / 2;
  const sy = y => H / 2 - (y - view.cy) * view.scale;

  function fitTo(b, animate) {
    if (!b) return;
    const pad = 60, dx = Math.max(b[2] - b[0], 1e-9), dy = Math.max(b[3] - b[1], 1e-9);
    const scale = Math.min((W - pad * 2) / dx, (H - pad * 2 - 90) / dy);
    const target = { cx: (b[0] + b[2]) / 2, cy: (b[1] + b[3]) / 2 - 45 / scale, scale: Math.min(scale, 4e8) };
    if (!animate) { view = target; draw(); return; }
    const from = Object.assign({}, view), t0 = performance.now();
    (function tick(now) {
      const t = Math.min(1, (now - t0) / 450), e = t * (2 - t);
      view = { cx: from.cx + (target.cx - from.cx) * e, cy: from.cy + (target.cy - from.cy) * e,
               scale: from.scale * Math.pow(target.scale / from.scale, e) };
      draw();
      if (t < 1) requestAnimationFrame(tick);
    })(t0);
  }

  // State after `step` operations of the selected sequence.
  function stateAt(seq, k) {
    const closed = new Set(), prevPipes = new Set(), prevHyds = new Set();
    let curPipes = new Set(), curHyds = new Set(), reopened = new Set();
    seq.s.ops.slice(0, k).forEach((o, i) => {
      const last = i === k - 1;
      o.close.forEach(v => closed.add(v));
      o.open.forEach(v => closed.delete(v));
      if (last) {
        curPipes = new Set(o.pipes); curHyds = new Set(o.hydrants); reopened = new Set(o.open);
      } else {
        o.pipes.forEach(p => prevPipes.add(p)); o.hydrants.forEach(h => prevHyds.add(h));
      }
    });
    curPipes.forEach(p => prevPipes.delete(p));
    curHyds.forEach(h => prevHyds.delete(h));
    return { closed, prevPipes, prevHyds, curPipes, curHyds, reopened };
  }

  function line(pts, w, color) {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1])));
    ctx.lineWidth = w; ctx.strokeStyle = color; ctx.stroke();
  }
  function dot(p, r, fill, stroke) {
    ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), r, 0, 6.2832);
    ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke();
  }
  function square(p, r, fill, stroke) {
    const x = sx(p[0]), y = sy(p[1]);
    ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 2;
    ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.strokeRect(x - r, y - r, r * 2, r * 2);
  }
  function label(text, p, dy) {
    ctx.font = "11px Segoe UI, Arial"; ctx.textAlign = "center"; ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.strokeText(text, sx(p[0]), sy(p[1]) + dy);
    ctx.fillStyle = "#1f2933"; ctx.fillText(text, sx(p[0]), sy(p[1]) + dy);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    zones.forEach(z => {
      ctx.beginPath();
      z.rings.forEach(poly => poly.forEach(r => r.forEach((p, i) => i ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1])))));
      ctx.fillStyle = "rgba(24,75,115,.04)"; ctx.fill("evenodd");
      ctx.lineWidth = 1.5; ctx.strokeStyle = "#52606d"; ctx.stroke();
    });
    pipes.forEach(pts => line(pts, 1, COLORS.pipe));
    const seq = seqs[seqIdx];
    if (!seq) return;
    const st = stateAt(seq, step);
    st.prevPipes.forEach(id => pipes.has(id) && line(pipes.get(id), 3, COLORS.prev));
    st.curPipes.forEach(id => pipes.has(id) && line(pipes.get(id), 5, COLORS.cur));
    const zoomed = view.scale > 0;
    seq.opValves.forEach(id => {
      const p = valves.get(id); if (!p) return;
      if (st.closed.has(id)) square(p, 6, "#e03131", "#a61e1e");
      else if (st.reopened.has(id)) square(p, 6, "#51cf66", "#2b8a3e");
      else square(p, 4, "#fff", "#868e96");
    });
    seq.opHyds.forEach(id => {
      const p = hydrants.get(id); if (!p) return;
      if (st.curHyds.has(id)) dot(p, 7, "#22b8cf", "#0b7285");
      else if (st.prevHyds.has(id)) dot(p, 5, "#fff", "#3b82c4");
      else dot(p, 4, "#fff", "#868e96");
    });
    if (zoomed) {
      st.curHyds.forEach(id => hydrants.has(id) && label(id, hydrants.get(id), -11));
      seq.s.ops.slice(0, step).forEach((o, i) => {
        if (i !== step - 1) return;
        o.close.concat(o.open).forEach(id => valves.has(id) && label(id + (o.notes[id] ? " " + o.notes[id] : ""), valves.get(id), -11));
      });
      zones.forEach(z => {
        if (z.label == null) return;
        const b = bounds([].concat(...z.rings.map(poly => [].concat(...poly))));
        if (b) label(String(z.label), [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2], 0);
      });
    }
  }

  // ----- results panel
  const resultsEl = document.getElementById("results");
  const fmt = (v, d) => (v == null || !isFinite(v)) ? "–" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function valveCell(o) {
    const td = el("td");
    const add = (kind, ids, tagText) => {
      if (!ids.length) return;
      const d = el("span", "valve-line");
      d.appendChild(el("span", "tag " + kind, tagText));
      d.appendChild(document.createTextNode(ids.map(v => v + (o.notes[v] ? " " + o.notes[v] : "")).join(", ")));
      td.appendChild(d);
    };
    add("close", o.close, "Close");
    add("open", o.open, "Open");
    add("hyd", o.hydrants, "Hydrant");
    if (!td.childNodes.length) td.appendChild(el("span", "muted", "–"));
    return td;
  }
  function buildResults() {
    document.getElementById("title").textContent = DATA.title || "Flushing Results";
    const opCount = seqs.reduce((a, q) => a + q.s.ops.length, 0);
    document.getElementById("subtitle").textContent = `${seqs.length} sequences · ${opCount} operations` + (DATA.generated ? ` · generated ${DATA.generated}` : "");
    seqs.forEach((q, si) => {
      const box = el("div", "seq"); box.dataset.i = si;
      const head = el("div", "seq-head");
      head.appendChild(el("span", "name", q.s.name));
      head.appendChild(el("span", "totals", `${q.s.ops.length} ops · ${fmt(q.totalTime, 0)} min · ${fmt(q.totalVolume, 0)} gal`));
      head.addEventListener("click", () => selectSequence(si, true));
      box.appendChild(head);
      const body = el("div", "seq-body");
      const table = el("table");
      const hr = el("tr");
      [["Op", ""], ["Time (min)", "num"], ["Volume (gal)", "num"], ["Avg flow (gpm)", "num"], ["Valves / hydrants", ""]].forEach(([t, c]) => hr.appendChild(el("th", c, t)));
      const thead = el("thead"); thead.appendChild(hr); table.appendChild(thead);
      const tb = el("tbody");
      q.s.ops.forEach((o, oi) => {
        const tr = el("tr", "op"); tr.dataset.op = oi;
        tr.appendChild(el("td", "", o.name));
        tr.appendChild(el("td", "num", o.pipes.length ? fmt(o.time, 1) : "–"));
        tr.appendChild(el("td", "num", o.pipes.length ? fmt(o.volume, 0) : "–"));
        tr.appendChild(el("td", "num", o.pipes.length ? fmt(o.flow, 0) : "–"));
        tr.appendChild(valveCell(o));
        tr.addEventListener("click", () => { pause(); setStep(oi + 1, true); });
        tb.appendChild(tr);
      });
      table.appendChild(tb); body.appendChild(table); box.appendChild(body); resultsEl.appendChild(box);
    });
  }
  function refreshResults() {
    resultsEl.querySelectorAll(".seq").forEach(b => b.classList.toggle("active", +b.dataset.i === seqIdx));
    const box = resultsEl.querySelector(`.seq[data-i="${seqIdx}"]`);
    if (!box) return;
    box.querySelectorAll("tr.op").forEach(tr => {
      const i = +tr.dataset.op;
      tr.classList.toggle("current", i === step - 1);
      tr.classList.toggle("done", i < step - 1);
    });
  }

  // ----- controls
  const slider = document.getElementById("slider"), statusEl = document.getElementById("status"), playBtn = document.getElementById("btnPlay");
  function updateStatus() {
    const q = seqs[seqIdx]; if (!q) { statusEl.textContent = "No sequences"; return; }
    const o = step ? q.s.ops[step - 1] : null;
    statusEl.textContent = "";
    const b = el("span", "", `${q.s.name}: `);
    statusEl.appendChild(b);
    if (!o) statusEl.appendChild(el("small", "", `ready – ${q.s.ops.length} operations`));
    else {
      statusEl.appendChild(document.createTextNode(`Operation ${o.name} (${step}/${q.s.ops.length}) `));
      const parts = [];
      if (o.close.length) parts.push("close " + o.close.join(", "));
      if (o.open.length) parts.push("open " + o.open.join(", "));
      if (o.hydrants.length) parts.push(`flush ${fmt(o.volume, 0)} gal in ${fmt(o.time, 1)} min at ${fmt(o.flow, 0)} gpm`);
      statusEl.appendChild(el("small", "", parts.join(" · ")));
    }
  }
  function setStep(k, follow) {
    const q = seqs[seqIdx]; if (!q) return;
    step = Math.max(0, Math.min(q.s.ops.length, k));
    slider.value = step;
    if (follow && document.getElementById("chkFollow").checked && step) {
      const o = q.s.ops[step - 1], pts = [];
      o.pipes.forEach(id => (pipes.get(id) || []).forEach(p => pts.push(p)));
      o.close.concat(o.open).forEach(id => valves.has(id) && pts.push(valves.get(id)));
      o.hydrants.forEach(id => hydrants.has(id) && pts.push(hydrants.get(id)));
      const b = bounds(pts);
      if (b) { const padv = Math.max(b[2] - b[0], b[3] - b[1], 0.0006) * 0.4; fitTo([b[0] - padv, b[1] - padv, b[2] + padv, b[3] + padv], true); }
    }
    updateStatus(); refreshResults(); draw();
    const row = resultsEl.querySelector("tr.op.current");
    if (row) row.scrollIntoView({ block: "nearest" });
  }
  function selectSequence(i, zoom) {
    pause(); seqIdx = i; step = 0;
    slider.max = seqs[i].s.ops.length; slider.value = 0;
    updateStatus(); refreshResults(); draw();
    if (zoom) fitTo(seqs[i].bounds ? padBounds(seqs[i].bounds) : fullBounds, true);
    const box = resultsEl.querySelector(`.seq[data-i="${i}"]`);
    if (box) box.scrollIntoView({ block: "nearest" });
  }
  function padBounds(b) { const p = Math.max(b[2] - b[0], b[3] - b[1], 0.0006) * 0.15; return [b[0] - p, b[1] - p, b[2] + p, b[3] + p]; }
  function pause() { playing = false; clearInterval(timer); timer = null; playBtn.innerHTML = "&#9654;"; }
  function advance() {
    const q = seqs[seqIdx];
    if (step < q.s.ops.length) { setStep(step + 1, true); return; }
    if (document.getElementById("chkAll").checked && seqIdx < seqs.length - 1) {
      const keep = true; selectSequence(seqIdx + 1, true); playing = keep; startTimer(); setStep(1, true);
    } else pause();
  }
  function startTimer() {
    clearInterval(timer);
    timer = setInterval(advance, +document.getElementById("speed").value);
    playBtn.innerHTML = "&#10074;&#10074;";
  }
  playBtn.addEventListener("click", () => {
    if (playing) { pause(); return; }
    const q = seqs[seqIdx];
    if (step >= q.s.ops.length) setStep(0, false);
    playing = true; startTimer(); advance();
  });
  document.getElementById("speed").addEventListener("change", () => { if (playing) startTimer(); });
  document.getElementById("btnNext").addEventListener("click", () => { pause(); setStep(step + 1, true); });
  document.getElementById("btnPrev").addEventListener("click", () => { pause(); setStep(step - 1, true); });
  document.getElementById("btnReset").addEventListener("click", () => { pause(); setStep(0, false); fitTo(seqs[seqIdx].bounds ? padBounds(seqs[seqIdx].bounds) : fullBounds, true); });
  slider.addEventListener("input", () => { pause(); setStep(+slider.value, true); });
  document.getElementById("zoomAll").addEventListener("click", () => fitTo(fullBounds, true));
  document.getElementById("zoomSeq").addEventListener("click", () => seqs[seqIdx] && fitTo(seqs[seqIdx].bounds ? padBounds(seqs[seqIdx].bounds) : fullBounds, true));
  function zoomBy(f, cx, cy) {
    const wx = (cx - W / 2) / view.scale + view.cx, wy = view.cy - (cy - H / 2) / view.scale;
    view.scale *= f; view.cx = wx - (cx - W / 2) / view.scale; view.cy = wy + (cy - H / 2) / view.scale; draw();
  }
  document.getElementById("zoomIn").addEventListener("click", () => zoomBy(1.5, W / 2, H / 2));
  document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1 / 1.5, W / 2, H / 2));

  // ----- map interaction
  let drag = null;
  canvas.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy }; canvas.classList.add("dragging"); });
  window.addEventListener("mouseup", () => { drag = null; canvas.classList.remove("dragging"); });
  window.addEventListener("mousemove", e => {
    if (drag) { view.cx = drag.cx - (e.clientX - drag.x) / view.scale; view.cy = drag.cy + (e.clientY - drag.y) / view.scale; draw(); }
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault(); const r = canvas.getBoundingClientRect();
    zoomBy(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  canvas.addEventListener("mousemove", e => {
    if (drag) return;
    const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    let hit = null, best = 100;
    const test = (map, kind) => map.forEach((p, id) => {
      const d = (sx(p[0]) - mx) ** 2 + (sy(p[1]) - my) ** 2;
      if (d < best) { best = d; hit = `${kind} ${id}`; }
    });
    test(hydrants, "Hydrant"); test(valves, "Valve");
    if (hit) { tip.textContent = hit; tip.style.display = "block"; tip.style.left = (mx + 12) + "px"; tip.style.top = (my + 12) + "px"; }
    else tip.style.display = "none";
  });
  canvas.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  window.addEventListener("resize", resize);

  buildResults();
  resize();
  if (seqs.length) { selectSequence(0, false); fitTo(fullBounds, false); }
  else { fitTo(fullBounds, false); statusEl.textContent = "No sequences in this project."; }
})();
</script>
